<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul Up - Level up ton calcul !</title>
    <meta name="description" content="Application d'entraînement mathématique gamifiée pour lycéens. Prépare ton bac avec des questions adaptées !">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase v10 CDN (latest compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Favicon -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    
    <!-- Styles personnalisés -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <div class="loading-content">
                <div class="loading-spin"></div>
                <h1 class="loading-title">Calcul Up</h1>
                <p class="loading-text">Initialisation...</p>
            </div>
        </div>
    </div>

    <!-- Modules JavaScript -->
    <script src="calcul-up-data.js"></script>
    <script src="calcul-up-core.js"></script>
    <script src="calcul-up-demo.js"></script>
    <script src="calcul-up-auth.js"></script>
    <script src="calcul-up-user.js"></script>
    <script src="calcul-up-questions.js"></script>
    <script src="calcul-up-game.js"></script>
    <script src="calcul-up-admin.js"></script>

    <!-- Initialisation -->
    <script>
        // Point d'entrée de l'application
        window.addEventListener('load', () => {
            console.log('🚀 Démarrage Calcul Up Enhanced...');

            // Vérifier si le mode démo était actif
            if (CalculUpDemo.isDemoModeActive()) {
                console.log('🎭 Mode démo détecté - Restauration session...');
                const demoUser = CalculUpDemo.getCurrentDemoUser();
                if (demoUser) {
                    // Restaurer la session démo
                    if (demoUser.type === 'admin') {
                        CalculUpCore.navigateToScreen('admin-dashboard');
                    } else if (demoUser.type === 'teacher') {
                        CalculUpCore.navigateToScreen('teacher-dashboard');
                    } else {
                        CalculUpCore.navigateToScreen('home');
                    }
                } else {
                    CalculUpDemo.showDemoLoginScreen();
                }
            } else {
                // Mode normal avec Firebase
                CalculUpCore.initialize();
            }
        });
    </script>
</body>
</html>
